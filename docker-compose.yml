name: ${COMPOSE_PROJECT_NAME:-seed-renewal}
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: mysql+pymysql://seed:seed-local@db:3306/seed
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-local-seed-renewal-change-me}
    SEED_DEMO: ${SEED_DEMO:-true}
    OPENBLAS_NUM_THREADS: 1
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-seed-renewal}-db
    environment: {MYSQL_ROOT_PASSWORD: seed-root-local, MYSQL_USER: seed, MYSQL_PASSWORD: seed-local, MYSQL_DATABASE: seed}
    ports: ['${DB_PORT:-17731}:3306']
    volumes: [db-data:/var/lib/mysql]
    healthcheck: {test: [CMD-SHELL, 'mysql --protocol=TCP -h 127.0.0.1 -useed -pseed-local seed -e "SELECT 1"'], interval: 4s, timeout: 4s, retries: 40}
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-seed-renewal}-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20}
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-seed-renewal}-backend
    ports: ['${BACKEND_PORT:-19231}:8000']
    healthcheck: {test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")'], interval: 3s, timeout: 5s, retries: 40}
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-seed-renewal}-worker
    command: python -m src.worker
    healthcheck: {test: [CMD, python, -c, 'import os,time; assert time.time()-os.stat("/tmp/seed-heartbeat").st_mtime<20'], interval: 3s, timeout: 3s, retries: 40}
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-seed-renewal}-frontend
    ports: ['${FRONTEND_PORT:-18231}:80']
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/health'], interval: 3s, timeout: 3s, retries: 20}
volumes:
  db-data:
  redis-data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.221.32.0/24}
